apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-core
  annotations:
    lab-owner: iot-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      service: iot-core
  template:
    metadata:
      labels:
        service: iot-core
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 3
